<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>球台設計室</title><link rel="stylesheet" href="/assets/pinball-editor.css"><script defer src="/assets/pinball-table.js?v=editor-1"></script><script defer src="/assets/pinball-design.js"></script><script defer src="/assets/pinball-editor.js"></script></head><body><header><h1>球台設計室</h1><a href="/pinball">返回遊戲</a></header><main><aside><p>選取元件後，拖動亮點調整形狀。手機可用下方座標微調。</p><label>選擇元件<select id="component"></select></label><label>節點<select id="node"></select></label><div class="coords"><label>左右 X<input id="x" type="number" min="0" max="480"></label><label>上下 Y<input id="y" type="number" min="0" max="860"></label></div><button id="position">套用座標</button><label>圓形半徑<input id="radius" type="number" min="5" max="40"></label><button id="size">調整大小</button><hr><button id="add">＋ 新增牆面</button><button id="remove">刪除新增牆面</button><button id="undo">復原上一步</button><button id="reset">還原原始球台</button><hr><button id="save">儲存設計</button><button id="play" class="primary">儲存並試玩</button><button id="export">匯出設計檔</button><label class="file">匯入設計檔<input id="import" type="file" accept="application/json,.json"></label><p id="status" role="status">設計只會套用在這個瀏覽器。匯出檔案可備份或傳給我修改。</p></aside><section><canvas id="editor" width="480" height="860" aria-label="可拖曳的彈珠台元件設計畫布"></canvas><p>青色亮點可拖曳 · 金色為目前選取元件 · 外框節點須維持上下順序</p></section></main></body></html>
