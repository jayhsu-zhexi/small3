<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203c32"><title>珠算練習室｜學習星球</title><meta name="description" content="自由撥珠、自訂加減題，按確認答案再判斷，慢慢練到答對。"><link rel="stylesheet" href="/assets/abacus.css?v=fx-7"><script defer src="/assets/abacus-engine.js?v=positive-8"></script><script defer src="/assets/abacus-ui.js?v=fx-7"></script></head>
<body><div id="answerEffect" class="answer-effect" aria-hidden="true" hidden><div class="answer-badge"><span class="answer-symbol"></span><strong id="effectLabel"></strong></div></div><main><header><a href="/">← 學習星球</a><span>ABACUS STUDIO</span></header><div class="page-title"><div><p class="eyebrow">一珠一數，慢慢練習</p><h1>珠算練習室</h1></div><div class="page-actions"><span class="mode" id="mode">自由練習</span><button id="openProblem" class="secondary" type="button" aria-haspopup="dialog">＋ 出題設定</button></div></div>
<div class="workspace"><section class="practice" aria-label="算盤練習"><div class="question"><span id="questionLabel">隨手撥一個數字</span><strong id="question">自由撥珠</strong></div><div class="board-head"><div><span>算盤上的數字</span><output id="value" aria-live="polite">0</output></div><button id="clear" type="button" class="secondary">↺ 清空算盤</button></div><div id="brass-abacus"><div class="ab-frame"><div class="ab-engraving">一 珠 一 數</div><div class="ab-field" id="field" aria-label="點選算珠靠梁或離梁"></div><div class="ab-labels" id="places"></div></div></div><p class="bead-hint">靠近橫梁才算數：上珠每顆是 5，下珠每顆是 1。</p><button id="check" class="primary check" type="button" disabled>確認答案</button><div id="feedback" class="feedback" role="status" aria-live="polite">自由撥珠，或按「出題設定」開始練習。</div></section>
</div><dialog id="problemDialog" aria-labelledby="problemTitle"><div class="panel"><button id="closeProblem" class="dialog-close" type="button" aria-label="關閉出題視窗">✕</button><p class="eyebrow">練習設定</p><h2 id="problemTitle">今天想算什麼？</h2><div class="source-switch" role="group" aria-label="出題來源"><button type="button" id="manualSource" aria-pressed="true">自己出題</button><button type="button" id="computerSource" aria-pressed="false">電腦出題</button></div><form id="computerForm" hidden><label for="autoLimit">數字與答案範圍</label><select id="autoLimit"><option value="10">10 以內</option><option value="20">20 以內</option><option value="100" selected>100 以內</option><option value="1000">1,000 以內</option><option value="99999">99,999 以內</option></select><label for="autoOperation">運算方式</label><select id="autoOperation"><option value="mixed">加減混合</option><option value="+">加法</option><option value="-">減法</option></select><p class="hint">答案至少為 1，不會出現 0 或負數。答對後可按「下一題」，答錯可繼續修改。</p><p id="autoError" role="alert" class="form-error"></p><button type="submit" class="primary">開始電腦出題</button></form><form id="problemForm" novalidate><label for="first">第一個數字</label><input id="first" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" value="12" aria-describedby="range"><fieldset><legend>運算方式</legend><label class="operator"><input type="radio" name="operation" value="+" id="add" checked><span>＋ 加法</span></label><label class="operator"><input type="radio" name="operation" value="-" id="subtract"><span>− 減法</span></label></fieldset><label for="second">第二個數字</label><input id="second" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" value="7" aria-describedby="range"><p id="range" class="hint">整數 0～99,999；答案須介於 0～99,999。</p><p id="formError" class="form-error" role="alert"></p><button type="submit" class="primary">用這兩個數字出題</button></form><button id="free" type="button" class="secondary free">回到自由練習</button><p class="hint">撥完再按「確認答案」。答錯可以繼續改，不限次數、不計時。</p></div></dialog><noscript>請啟用 JavaScript，才能撥動算珠。</noscript></main></body></html>
