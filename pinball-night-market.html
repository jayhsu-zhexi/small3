<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>夜市彈珠台｜跑燈挑戰</title><meta name="description" content="停止跑燈、控制力道發射，挑戰十顆彈珠命中亮燈球道。"><link rel="stylesheet" href="/assets/night-market.css?v=running-lights-2"><script defer src="/assets/night-market-engine.js?v=running-lights-2"></script><script defer src="/assets/night-market-ui.js?v=running-lights-2"></script></head><body><main><header><div><small>NIGHT MARKET ARCADE</small><h1>夜市彈珠台 · 跑燈挑戰</h1></div><a href="/">返回首頁</a></header><div class="hud"><div><span>本局分數</span><strong id="score">0</strong></div><div><span>剩餘彈珠</span><strong id="remaining">10</strong></div><div><span>連續命中</span><strong id="streak">0</strong></div></div><div class="layout"><div class="board"><canvas id="table" width="960" height="1520" role="img" aria-label="九個球道的夜市彈珠台，使用停止跑燈與發射按鈕操作"></canvas></div><aside><span class="tag">一局 10 球 / 每次 3 個目標</span><p id="notice" role="status">先停止跑燈，鎖定目標球道。</p><p id="targets">亮燈球道：1、2、3</p><div class="actions"><button id="stop">停止跑燈</button><button id="launch" disabled>按住發射</button></div><div class="meter" role="progressbar" aria-label="發射力道" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="power"><i id="fill"></i></div><div class="tools"><button id="pause">暫停</button><button id="sound" aria-pressed="true">音效開</button><button id="restart">重新開始</button></div><p>命中 +100 分。連中第二球額外 +25，第三球起額外 +50。<br>發射太弱會退回，不扣球。<br>空白鍵：停燈／按住蓄力，放開發射。<br><a href="/pinball">太空彈珠台與設計室</a></p></aside></div><dialog id="result"><h2 id="resultTitle">本局完成</h2><strong id="finalScore">0 分</strong><p id="summary"></p><button id="again">再玩一次</button></dialog><dialog id="confirm"><h2>重新開始？</h2><p>本局分數與剩餘彈珠會重設。</p><button id="cancel">繼續這局</button><button id="confirmRestart">重新開始</button></dialog><noscript>請啟用 JavaScript 遊玩。</noscript></main></body></html>
