<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>夜市彈珠台｜跑燈挑戰</title><meta name="description" content="停止跑燈、控制力道發射，挑戰十顆彈珠命中亮燈球道。"><link rel="stylesheet" href="/assets/night-market.css?v=cabinet-grid-10"><script defer src="/assets/night-market-engine.js?v=cabinet-grid-10"></script><script defer src="/assets/night-market-art.js?v=cabinet-grid-10"></script><script defer src="/assets/night-market-ui.js?v=cabinet-grid-10"></script></head><body><main><header><div><small>NIGHT MARKET ARCADE</small><h1>夜市彈珠台 · 跑燈挑戰</h1></div><a href="/">返回首頁</a></header><section class="cabinet"><div class="cabinet-top"><div class="marquee"><span aria-hidden="true">🏮</span><h2>夜市彈珠台</h2><span aria-hidden="true">🏮</span></div><div class="hud"><div><span>本局分數</span><strong id="score">0</strong></div><div><span>剩餘彈珠</span><strong id="remaining">10</strong></div><div><span>連續命中</span><strong id="streak">0</strong></div></div></div><div class="layout"><div class="board"><canvas id="table" width="960" height="1520" role="img" aria-label="九個球道的夜市彈珠台，使用停止跑燈與發射按鈕操作"></canvas></div><aside><span class="tag">一局 10 球 / 每次 3 個目標</span><p id="notice" role="status">先停止跑燈，鎖定目標球道。</p><p id="targets">亮燈球道：1、2、3</p><div class="actions"><button id="stop" aria-label="停止跑燈"><span class="icon-medallion"><svg class="control-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/><path d="M8 3h8M8 21h8M3 8v8M21 8v8"/></svg></span><span>停止跑燈</span></button><div class="power-panel"><span>發射力道</span><div class="meter" role="progressbar" aria-label="發射力道" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="power"><i id="fill"></i></div><small>按住蓄力 · 放開發射</small></div><button id="launch" disabled aria-label="按住蓄力，放開發射" aria-pressed="false"><span class="icon-medallion"><svg class="control-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15V3m-5 5 5-5 5 5M6 21h12M8 18h8"/><circle cx="12" cy="14" r="3" fill="currentColor" stroke="none"/></svg></span><span>按住發射</span></button></div><div class="tools"><button id="pause" aria-label="暫停"><svg class="control-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><g class="pause-symbol"><path d="M8 5v14M16 5v14" stroke-width="4"/></g><path class="play-symbol" d="m8 4 12 8-12 8Z" fill="currentColor" stroke="none"/></svg><span id="pauseLabel">暫停</span></button><button id="sound" aria-pressed="true" aria-label="音效開"><svg class="control-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m11 4-6 5H2v6h3l6 5Z"/><g class="sound-waves"><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></g><path class="sound-mute" d="m16 9 6 6m0-6-6 6"/></svg><span id="soundLabel">音效開</span></button><button id="restart" aria-label="重新開始"><svg class="control-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg><span>重玩</span></button></div><p>命中 +100 分。連中第二球額外 +25，第三球起額外 +50。<br>發射太弱會退回，不扣球。<br>空白鍵：停燈／按住蓄力，放開發射。<br><a href="/pinball">太空彈珠台與設計室</a></p></aside></div></section><dialog id="result"><h2 id="resultTitle">本局完成</h2><strong id="finalScore">0 分</strong><p id="summary"></p><button id="again">再玩一次</button></dialog><dialog id="confirm"><h2>重新開始？</h2><p>本局分數與剩餘彈珠會重設。</p><button id="cancel">繼續這局</button><button id="confirmRestart">重新開始</button></dialog><noscript>請啟用 JavaScript 遊玩。</noscript></main></body></html>
