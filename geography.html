<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地理探險任務｜國一地理</title><link rel="stylesheet" href="/assets/geography.css"><script defer src="/assets/geography-engine.js"></script><script defer src="/assets/geography-ui.js"></script></head>
<body><main class="expedition">
<a class="top-home" href="/">← 返回學習星球</a>
<header class="masthead"><div class="brand"><span class="compass" aria-hidden="true">✥</span><div><h1>地理探險任務</h1><p>國一地理・進階挑戰</p></div></div><div class="quote">探索世界，<br>從地圖開始。</div><div class="profile"><span aria-hidden="true">🎩</span><div><strong id="rank">探險者 Lv.1</strong><div class="track"><i id="rankBar"></i></div></div></div></header>
<div class="mobile-route-bar"><label for="mobileRoutes">任務路線<select id="mobileRoutes" aria-label="選擇地理任務"></select></label></div>
<div class="workspace"><aside class="sidebar"><h2><span aria-hidden="true">△</span> 任務路線</h2><p class="english">EXPEDITION ROUTE</p><nav id="routes" aria-label="選擇地理任務"></nav><div class="sidebar-note">每一次的探索，<br>都是更靠近世界的一步。</div><p class="scope">康軒七上第1–2課練習。<br>新增第2課：位置對臺灣的影響。<br>學校實際段考範圍待確認。</p></aside>
<section class="paper" aria-labelledby="missionTitle"><div class="mission-head"><h2 id="missionTitle"></h2><span id="questionCount"></span></div><p id="prompt" class="prompt"></p><div id="map" class="map" aria-label="任務地圖"></div><div id="choices" class="choices" role="group" aria-label="選擇答案"></div><div class="actions"><button id="hintButton" class="hint-button">♧ 看提示</button><button id="confirm" class="confirm-button">✥ 確認位置</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div id="result" hidden></div></section></div>
<footer class="footer"><div class="journey"><span class="footer-compass" aria-hidden="true">✥</span><div><strong>探索進度</strong><div class="track"><i id="journeyBar"></i></div><small id="progressText">已完成 0 / 120 題</small></div></div><div class="badges" id="badges"></div><button id="restart" class="restart">重新探索</button></footer>
</main><dialog id="restartDialog"><h2>重新開始探索？</h2><p>這會清除本次地理任務的進度。</p><button id="cancelRestart">繼續探索</button><button id="acceptRestart">重新開始</button></dialog></body></html>
