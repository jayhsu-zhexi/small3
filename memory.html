<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111c"><title>ORBIT // BLACKOUT 失聯太空站</title><meta name="description" content="科幻生存翻牌配對。選擇 16 至 52 張卡牌，在時間與護盾耗盡前配對能源模組，重啟太空站。"><link rel="canonical" href="https://small3.vercel.app/memory"><link rel="stylesheet" href="/assets/memory.css"><link rel="stylesheet" href="/assets/memory-home.css"><link rel="stylesheet" href="/assets/memory-cards.css"><link rel="preload" as="image" href="/assets/memory-home-v2.png"><script defer src="/assets/memory-engine.js"></script><script defer src="/assets/memory-audio.js"></script><script defer src="/assets/memory-ui.js"></script></head>
<body><div class="home-atmosphere" aria-hidden="true"><img src="/assets/memory-home-v2.png" alt="" width="1672" height="941" fetchpriority="high"></div><canvas id="particles" aria-hidden="true"></canvas><div class="orbit-shell"><header class="orbit-header"><a href="/" class="orbit-brand" aria-label="返回學習首頁" title="返回學習首頁"><span class="home-ui-art ui-reactor" aria-hidden="true"></span></a><div class="header-controls"><label class="audio-switch icon-control" title="音效"><input id="memorySound" type="checkbox" checked class="audio-input" aria-label="音效"><span class="home-ui-art ui-speaker" aria-hidden="true"></span></label><button id="memoryHelp" class="quiet-button icon-control" aria-label="玩法" title="玩法"><span class="home-ui-art ui-help" aria-hidden="true"></span></button><a href="/" class="quiet-button icon-control" aria-label="離開遊戲，返回學習首頁" title="返回學習首頁"><span class="home-ui-art ui-exit" aria-hidden="true"></span></a></div></header>
<main><section id="memoryHome" class="mission-home">
  <div class="mission-hero">
    <div class="home-copy">
      <h1 class="home-title"><img src="/assets/memory-title.png" alt="失聯太空站" width="1448" height="1086" fetchpriority="high"></h1>
      <div class="mission-story" role="img" aria-label="找到成對的能源模組，讓太空站重新亮起" title="找到成對的能源模組，讓太空站重新亮起"><span class="control-art art-pair" aria-hidden="true"></span><span class="story-arrow" aria-hidden="true">→</span><span class="home-ui-art ui-power" aria-hidden="true"></span><span class="story-arrow" aria-hidden="true">→</span><span class="home-ui-art ui-station" aria-hidden="true"></span></div>
    </div>
    <fieldset class="theme-picker"><legend class="sr-only">選擇卡牌外觀，預設為 C 太空裝備艙</legend><div id="memoryThemes" class="theme-options"></div></fieldset>
  </div>
  <div class="mission-setup" aria-label="救援任務設定">
    <div class="mission-controls">
      <fieldset><legend class="sr-only">選擇卡牌數量</legend><div id="memoryCounts" class="count-options"></div></fieldset>
      <div class="mission-specs">
        <div class="setup-stat" title="任務時間"><span class="control-art art-clock" aria-hidden="true"></span><span class="sr-only">任務時間</span><strong id="setupTime">03:00</strong></div>
        <div class="setup-stat" title="初始護盾"><span class="control-art art-shield" aria-hidden="true"></span><span class="sr-only">初始護盾</span><strong id="setupShield">16</strong></div>
        <div class="setup-stat" title="待配對的組數"><span class="control-art art-pair" aria-hidden="true"></span><span class="sr-only">待配對</span><strong id="setupPairs">08</strong><span class="sr-only">組</span></div>
      </div>
      <div class="mission-launch"><button id="memoryStart" class="launch-button" aria-label="啟動救援" title="啟動救援"><span class="control-art art-rocket" aria-hidden="true"></span><span class="launch-play" aria-hidden="true">▶</span></button></div>
    </div>
    <div class="setup-rules">
      <div class="picture-rule rule-miss" role="img" aria-label="兩張不同的卡牌會消耗 1 點護盾" title="配錯一次，消耗 1 點護盾"><span class="rule-card" aria-hidden="true"><span class="control-art art-clock"></span></span><span class="rule-card" aria-hidden="true"><span class="control-art art-star"></span></span><span class="rule-cross" aria-hidden="true">×</span><span class="rule-arrow" aria-hidden="true">→</span><span class="control-art art-shield" aria-hidden="true"></span><strong aria-hidden="true">−1</strong></div>
      <div class="picture-rule rule-combo" role="img" aria-label="連續配對成功，每次額外多得 25 分，最高額外 225 分" title="連續配對成功，每次額外多得 25 分，最高額外 225 分"><span class="control-art art-pair" aria-hidden="true"></span><span class="rule-check" aria-hidden="true">✓</span><span class="control-art art-pair" aria-hidden="true"></span><span class="rule-check" aria-hidden="true">✓</span><span class="rule-arrow" aria-hidden="true">→</span><span class="control-art art-star" aria-hidden="true"></span><strong aria-hidden="true">+25</strong></div>
    </div>
  </div>
  <p id="artworkStatus" class="artwork-status" role="status" hidden></p>
</section>
<section id="memoryGame" class="mission-game" hidden aria-label="能源模組配對任務"><div class="game-heading"><div><p class="sector-label">RECOVERY IN PROGRESS</p><h1>能源模組配對 <span id="deckLabel">16 張</span></h1></div><button class="quiet-button" id="memoryPause">Ⅱ 暫停</button></div><div class="status-deck"><div class="hud-time"><span>剩餘時間</span><strong id="timeValue" role="timer" aria-live="off">03:00</strong></div><div><span>得分</span><strong id="scoreValue">0</strong></div><div class="hud-combo"><span>連擊</span><strong id="comboValue">×0</strong></div><div><span>護盾</span><strong id="shieldValue">16/16</strong></div><div><span>已配對</span><strong id="pairsValue">0/8</strong></div></div><div class="power-track" role="progressbar" id="powerTrack" aria-label="太空站修復進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="powerFill"></div></div><div id="memoryGrid" class="memory-grid" aria-label="翻牌配對卡牌"></div><div class="game-footer"><p id="memoryStatus" role="status">找出兩張相同的模組。</p><span>翻牌 <strong id="flipsValue">0</strong> 次</span><button class="quiet-button" id="memoryRestart">↻ 重新開始</button></div></section></main><footer class="orbit-footer sr-only"><span id="audioStatus" role="status">音效會在開始操作後啟用。</span></footer></div>
<dialog id="missionDialog" class="orbit-dialog" aria-labelledby="dialogTitle"><p id="dialogTag" class="sector-label"></p><h2 id="dialogTitle" tabindex="-1"></h2><p id="dialogCopy"></p><div id="dialogStats" class="dialog-stats"></div><div class="dialog-actions"><button id="dialogResume" class="launch-button">繼續任務</button><button id="dialogRestart" class="secondary-button">重新啟動</button><button id="dialogMenu" class="quiet-button">選擇難度</button></div></dialog><noscript><p class="no-script">請開啟 JavaScript 才能翻牌遊玩。</p></noscript></body></html>
