<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e9"><title>方塊消消樂｜學習星球</title><link rel="stylesheet" href="/assets/blocks.css"><script defer src="/assets/blocks-engine.js"></script><script defer src="/assets/blocks-ui.js"></script></head>
<body><main class="blocks-page"><a class="home" href="/">← 返回學習星球</a><header><h1>方塊消消樂</h1><p>排滿一整排，就能消除！</p></header>
<section class="play-layout" aria-label="方塊遊戲"><div class="board-frame"><canvas id="blocksBoard" aria-label="10欄20排方塊棋盤"></canvas><div class="board-overlay" id="boardOverlay"><div class="overlay-card"><span class="overlay-star" aria-hidden="true">✦</span><h2 id="overlayTitle">一起玩方塊！</h2><p id="overlayText">移動、旋轉，排滿整排就能消除。</p><button id="playButton">開始遊戲</button></div></div></div>
<aside class="game-sidebar" aria-label="遊戲資訊"><div class="stat score"><h2>分數</h2><strong id="score">0</strong></div><div class="stat lines"><h2>已消除</h2><strong><span id="lines">0</span><small> 排</small></strong></div><div class="stat next"><h2>下一個</h2><canvas id="nextPiece" aria-label="下一個方塊"></canvas></div><button class="pause" id="pauseButton" disabled><span aria-hidden="true">Ⅱ</span> 暫停</button><button class="restart" id="restartButton"><span aria-hidden="true">⟳</span> 重新開始</button><div class="encourage"><div class="mascot" aria-hidden="true"><i></i><b>ᴗ</b></div><p id="encourage">慢慢來，<br>你可以的！</p></div><p class="best">最高分 <b id="bestScore">0</b><span id="level">第 1 級</span></p></aside></section>
<nav class="controls" aria-label="方塊操作"><button data-action="left" class="left"><span aria-hidden="true">⬅</span>左移</button><button data-action="rotate" class="rotate"><span aria-hidden="true">⟳</span>旋轉</button><button data-action="right" class="right"><span aria-hidden="true">➜</span>右移</button><button data-action="down" class="down"><span aria-hidden="true">⬇</span>下降</button><button data-action="drop" class="drop"><span aria-hidden="true">⇊</span>快速落下</button></nav>
<p class="instructions">左右移動找位置，填滿整排拿高分！<span>鍵盤 ← → 移動・↑ 旋轉・↓ 下降・空白鍵快速落下・P 暫停</span></p><p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
<dialog id="restartDialog"><h2>要重新開始嗎？</h2><p>這局會重新開始，最高分會保留。</p><div><button id="cancelRestart">繼續這局</button><button id="confirmRestart">重新開始</button></div></dialog></main></body></html>
