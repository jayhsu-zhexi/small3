<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef5df"><title>單字探險樂園｜學習星球</title><meta name="description" content="小狐狸陪孩子看圖學英文，聽發音、找圖片，收集單字貼紙。"><link rel="stylesheet" href="/assets/vocabulary.css?v=2"><link rel="stylesheet" href="/assets/vocabulary-art.css?v=3"><script defer src="/assets/vocabulary-engine.js?v=1"></script><script defer src="/assets/vocabulary-ui.js?v=3"></script></head><body><main>
<header><a href="/">← 學習星球</a><button id="sound" aria-pressed="true">♪ 聲音開</button></header>
<section id="home"><div class="hero"><div class="title-plaque"><h1>單字探險樂園</h1><p class="hero-tag">每天探索 5 個單字</p></div><div class="fox" aria-hidden="true"></div><div class="trail-sign" aria-hidden="true"><span>小小單字<br>大大世界<br>一起去探險！</span></div><div class="trail-stones" aria-hidden="true"><i>1</i><i>2</i><i>3</i></div></div><h2 class="small-title">選一個主題，一起探險</h2><div id="themes" class="themes"></div><button id="start" class="primary">開始探險 →</button><button id="book" class="secondary">📖 我的單字圖鑑 · 0 / 60</button><p class="home-note">不計時，可以重複聽、慢慢試。完成探險獲得一張貼紙！</p></section>
<section id="game" hidden><div class="game-head"><button id="exit">← 返回選單</button><strong id="stage"></strong></div><div class="dots" id="dots" aria-hidden="true"></div><h2 id="prompt"></h2><div class="learning-board"><div class="lesson-scene"><div id="object" class="word-art" role="img"></div><div id="guideFox" class="fox" aria-hidden="true"></div><div id="sparkles" aria-hidden="true">✦ ★ ✦</div></div><div id="word-panel"><h3 id="word" lang="en"></h3><p id="translation" lang="zh-Hant"></p></div><div class="listen-controls"><button id="listen"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8q4 4 0 8M19 5q7 7 0 14"/></svg>英文發音</button><button id="slow"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8q4 4 0 8"/></svg>慢速英文</button><button id="listenZh"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8q4 4 0 8"/></svg>中文發音</button></div></div><p id="audioStatus" role="status"></p><button id="transcript" class="text-button" hidden>看文字提示</button><div id="choices" class="choices"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" class="primary">下一個單字 →</button></section>
<section id="result" class="result" hidden><div class="fox happy" aria-hidden="true"></div><div class="sticker">★</div><h2>探險完成！</h2><p id="summary"></p><div id="resultWords" class="result-words"></div><p id="resultAudio" role="status"></p><button id="again" class="primary">再探索 5 個單字 →</button><button id="resultHome" class="secondary">返回主選單</button></section>
<dialog id="collection"><div class="dialog-head"><h2>我的單字圖鑑</h2><button id="closeBook" aria-label="關閉圖鑑">✕</button></div><p id="collectionCount"></p><p>點選單字聽英文，點「中文發音」聽中文。</p><div id="collectionWords" class="collection-words"></div><p id="bookAudio" role="status"></p></dialog>
<dialog id="exitConfirm"><h2>要離開這次探險嗎？</h2><p>這次尚未完成的練習會重新開始。</p><button id="stay" class="primary">繼續探險</button><button id="leave" class="secondary">返回主選單</button></dialog>
<noscript>請開啟 JavaScript，才能開始探險。</noscript></main></body></html>
