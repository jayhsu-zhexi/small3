<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9ed"><title>公分毫米小工坊｜小三長度換算</title><link rel="stylesheet" href="/assets/length.css"><script defer src="/assets/length-engine.js"></script><script defer src="/assets/multiply-audio.js"></script><script defer src="/assets/length-ui.js"></script></head>
<body><main class="workshop">
<header class="top"><a class="home" href="/">← 返回</a><div><h1>公分毫米小工坊<span aria-hidden="true">✎</span></h1><p>小三數學・長度換算</p></div><img class="stationery" src="/assets/length-stationery.webp" alt=""></header>
<label class="mode-bar" for="mode">練習題型<select id="mode"></select></label>
<section class="question panel" aria-labelledby="questionTitle"><div class="panel-head"><h2 id="questionTitle">長度換算</h2><span id="progress">第 1 題 / 共 10 題</span></div>
<div class="question-body"><strong class="rule">1 公分＝10 毫米</strong><h3 id="prompt"></h3>
<div class="measurement" id="measurement"><div class="scale" id="scale" role="img" aria-label="尺規與橡皮擦"><img id="eraser" src="/assets/length-eraser.webp" alt=""><svg id="ruler" viewBox="0 0 680 170" aria-hidden="true"></svg></div></div>
<div id="answers" class="answers" aria-label="長度換算答案"></div>
<div class="actions" id="actions"><button id="hint" class="hint">☼ 看提示</button><button id="check" class="check">✓ 確認答案</button></div>
<div class="helper" id="helper"><img src="/assets/length-bear.webp" alt="閱讀小熊"><p id="feedback" role="status" aria-live="polite">先換成毫米，再加起來。</p></div>
<p class="scale-note" id="scaleNote">尺規僅供讀刻度，非實際大小。</p><div id="result" hidden></div></div></section>
<section class="keypad-panel panel" aria-labelledby="keypadTitle"><div class="panel-head"><h2 id="keypadTitle">點數字填答案</h2><button id="sound" class="sound" type="button" aria-label="關閉音效" aria-pressed="true">🔊 音效</button></div>
<div class="keypad" id="keypad"><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button id="clear" class="tool">清除</button><button data-digit="0">0</button><button id="erase" class="tool" aria-label="刪除一個數字">⌫</button></div></section>
<p id="saveNote" class="save-note">進度會自動保存。</p>
<dialog id="switchDialog"><h2>開始另一種練習？</h2><p>目前這一輪會換成新的 10 題。</p><button id="cancelSwitch">繼續這一輪</button><button id="confirmSwitch">開始新練習</button></dialog>
</main></body></html>
