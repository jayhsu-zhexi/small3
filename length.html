<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9ed"><title>公分毫米小工坊｜小三長度換算</title><link rel="stylesheet" href="/assets/length.css?v=endpoints-28"><script defer src="/assets/length-engine.js?v=endpoints-28"></script><script defer src="/assets/multiply-audio.js"></script><link rel="stylesheet" href="/assets/completion-party.css?v=party-23"><script defer src="/assets/completion-party.js?v=instant-25"></script><script defer src="/assets/length-ui.js?v=endpoints-28"></script></head>
<body><main class="workshop" id="workshop">
<header class="top"><a class="home" href="/">← 返回</a><div><h1>公分毫米小工坊<span aria-hidden="true">✎</span></h1><p>小三數學・長度換算</p></div><img class="stationery" src="/assets/length-stationery.webp" alt=""></header>
<label class="mode-bar" for="mode">練習題型<select id="mode"></select></label>
<section id="question" class="question panel" aria-labelledby="questionTitle"><div class="panel-head"><h2 id="questionTitle">長度換算</h2><span id="progress">第 1 題 / 共 10 題</span></div>
<section id="answerTrack" class="answer-track" aria-label="每題作答紀錄" hidden><span id="answerTrackSummary" class="answer-track-summary" role="status" aria-live="polite"></span><ol id="answerLights" class="answer-lights" aria-label="題號燈：綠色一次答對、紅色答錯過、灰色未作答"></ol></section>
<div class="question-body"><strong id="unitRule" class="rule">1 公分＝10 毫米</strong><h3 id="prompt"></h3><p id="examNotice" class="exam-notice" hidden>測驗共 10 題，交卷後公布成績。</p>
<div class="measurement" id="measurement"><p id="rulerVerification" class="ruler-verification" hidden>用尺規驗證看看</p><div class="scale" id="scale" role="img" aria-label="尺規與橡皮擦"><img id="eraser" src="/assets/length-eraser.webp" alt=""><svg id="ruler" viewBox="0 0 680 170" aria-hidden="true"></svg></div></div>
<section id="guidePractice" class="guide-practice" aria-label="起點不是零的分步練習" hidden><ol id="guideSteps" class="guide-steps"><li>找起點</li><li>找終點</li><li>算長度</li></ol><p id="guideEndpoints" class="guide-endpoints"></p><h4 id="guideTitle"></h4><p id="guideMessage" class="guide-message" role="status" aria-live="polite"></p><div id="guideChoices" class="guide-choices"></div><p id="guideFormula" class="guide-formula" hidden></p></section>
<div id="answers" class="answers" aria-label="長度換算答案"></div>
<div id="answerFeedback" class="answer-feedback" role="status" aria-live="polite" aria-atomic="true" hidden><span id="feedbackIcon" class="feedback-icon" aria-hidden="true"></span><div><strong id="feedbackTitle"></strong><p id="feedbackDetail"></p></div></div>
<div class="actions" id="actions"><button id="hint" class="hint">☼ 看提示</button><button id="examPrevious" class="exam-previous" type="button" hidden>← 上一題</button><button id="check" class="check">✓ 確認答案</button></div>
<div class="helper" id="helper"><img src="/assets/length-bear.webp" alt="閱讀小熊"><p id="feedback" role="status" aria-live="polite">先換成毫米，再加起來。</p></div>
<p class="scale-note" id="scaleNote">尺規僅供讀刻度，非實際大小。</p><div id="result" hidden></div><div id="examReview" class="exam-review" aria-label="交卷後的逐題解答" hidden></div></div></section>
<section id="keypadPanel" class="keypad-panel panel" aria-labelledby="keypadTitle"><div class="panel-head"><h2 id="keypadTitle">點數字填答案</h2><button id="sound" class="sound" type="button" aria-label="關閉音效" aria-pressed="true">🔊 音效</button></div>
<p id="guideKeypadNote" class="guide-keypad-note" hidden>先找起點、找終點，再用減法填答案。</p>
<div class="keypad" id="keypad"><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button id="clear" class="tool">清除</button><button data-digit="0">0</button><button id="erase" class="tool" aria-label="刪除一個數字">⌫</button></div></section>
<p id="saveNote" class="save-note">進度會自動保存。</p>
<dialog id="switchDialog"><h2>開始另一種練習？</h2><p>目前這一輪會換成新的 10 題。</p><button id="cancelSwitch">繼續這一輪</button><button id="confirmSwitch">開始新練習</button></dialog>
</main></body></html>
