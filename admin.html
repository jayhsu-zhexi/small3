<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>管理小屋｜學習星球</title><link rel="stylesheet" href="/assets/admin.css?v=drag-2"><script defer src="/assets/site-settings.js?v=number-bakery-1"></script><script defer src="/assets/admin.js?v=drag-2"></script></head>
<body><header class="topbar"><a href="/" class="brand"><span aria-hidden="true">🪐</span><span>學習星球 <small>管理小屋</small></span></a><a class="text-link" href="/" target="_blank" rel="noopener">前往網站 ↗</a></header>
<main><section id="loginPanel" class="login panel"><div class="login-icon" aria-hidden="true">🔑</div><p class="eyebrow">歡迎回來</p><h1>管理你的小小學習世界</h1><p class="muted">調整首頁，讓孩子更容易找到喜歡的遊戲。</p><form id="loginForm"><label for="password">管理密碼</label><input id="password" type="password" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="off" required placeholder="輸入 8 位數密碼"><button id="loginButton" class="primary" type="submit">進入管理小屋 →</button></form><p id="loginStatus" class="status" role="status"></p></section>
<section id="workspace" hidden><div class="workspace-heading"><div><p class="eyebrow">讓每一次學習，都更有趣</p><h1>首頁管理</h1><p class="muted" id="storageNote"></p></div><button id="logout" class="quiet">登出</button></div>
<div class="summary"><span><b id="visibleCount">16</b> 款遊戲顯示中</span><span><i class="dot"></i><span id="saveState">已載入設定</span></span><span id="updatedAt">尚未更新</span></div>
<div class="editor-layout"><div class="editor"><section class="panel"><h2><span class="section-number">01</span> 首頁文字</h2><label for="homeTitle">首頁名稱</label><input id="homeTitle" maxlength="24"><label for="homeIntro">首頁說明</label><textarea id="homeIntro" maxlength="90" rows="2"></textarea></section>
<section class="panel"><div class="section-heading"><h2><span class="section-number">02</span> 遊戲入口</h2><span class="muted">上、下移動調整順序</span></div><p class="field-note">隱藏只會移除首頁卡片，不會刪除遊戲或孩子的紀錄。</p><ol id="gameList" class="game-list"></ol></section></div>
<aside class="preview-panel panel"><div class="section-heading"><h2>拖拉調整首頁</h2><label class="preview-switch"><input id="previewEdit" type="checkbox" checked> 編輯預覽</label></div><p class="field-note">按住卡片的「按住拖拉」移動位置，也能直接隱藏或標記新遊戲。取消勾選可看實際首頁。</p><iframe id="preview" title="首頁設定預覽" src="about:blank" sandbox="allow-scripts allow-same-origin"></iframe></aside></div>
<footer class="savebar"><div><strong id="barTitle">準備好了就儲存</strong><p id="actionStatus" class="status" role="status">預覽不會影響目前網站。</p></div><div class="save-actions"><button id="discard" class="quiet">還原未儲存修改</button><button id="save" class="primary">儲存並套用</button></div></footer></section></main></body></html>
