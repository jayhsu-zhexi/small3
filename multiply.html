<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ec"><title>乘法小學堂｜小三乘法練習</title><link rel="stylesheet" href="/assets/multiply.css"><script defer src="/assets/multiply-engine.js"></script><script defer src="/assets/multiply-ui.js"></script></head><body>
<main class="school"><a href="/" class="home">← 返回學習星球</a><header><h1>乘法小學堂</h1><p>小三乘法練習・一步一步算，更有信心！</p><div class="rewards"><span aria-hidden="true">★ ★ ★</span><strong id="rewardText">已完成 0 題</strong></div></header>
<div class="mobile-modes"><label for="mobileMode">選擇練習<select id="mobileMode"></select></label></div>
<div class="school-layout"><aside class="modes panel"><h2>▤ 選擇練習</h2><nav id="modeButtons" aria-label="乘法練習種類"></nav><p class="daily">🌱 每天 10 題，<br>慢慢變厲害！</p></aside>
<section class="question panel" aria-labelledby="questionTitle"><div class="question-head"><h2 id="questionTitle">二位數 × 一位數</h2><span id="questionCount">第 1 題 / 共 10 題</span></div><div class="question-body"><p id="prompt" class="prompt"></p><div id="pencilBoxes" class="pencil-boxes" aria-hidden="true"></div><div id="written" class="written" aria-label="乘法直式填答"></div><p id="inputGuide" class="input-guide">先填個位，再填十位。</p><div class="actions"><button id="hintButton" class="hint">♧ 看提示</button><button id="checkButton" class="check">✓ 確認答案</button></div><button id="clearButton" class="clear">⟳ 清除重寫</button><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div id="result" hidden></div></div></section>
<aside class="keypad-panel panel"><h2>▦ 點數字填答案</h2><div id="keypad" class="keypad" aria-label="數字鍵盤"><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button id="keyClear" class="key-tool">清除</button><button data-digit="0">0</button><button id="keyBackspace" class="key-tool" aria-label="刪除目前一格">⌫</button></div><div class="helper"><img src="/assets/multiply-bear.webp" alt="可愛的小熊陪你練習"><p id="bearTip">從個位開始，<br>記得對齊喔！</p></div><p class="save-note" id="saveNote">這一輪會自動存檔。</p></aside></div>
<footer>🌱 答錯也沒關係，想一想再試一次！ 🌱</footer>
<dialog id="switchDialog"><h2>開始另一輪練習？</h2><p>目前這一輪的答題紀錄將換成新的 10 題。</p><button id="cancelSwitch">繼續這一輪</button><button id="confirmSwitch">開始新練習</button></dialog></main></body></html>
