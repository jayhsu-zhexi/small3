<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102b63">
  <title>學習星球大冒險</title>
  <style>
    :root{--ink:#14224a;--muted:#52617d;--blue:#3157d5;--orange:#ff6b4a;--green:#16805b}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:#07152f}button{font:inherit}
    .shell{min-height:100svh;display:grid;place-items:center;padding:clamp(12px,4vw,38px);background:radial-gradient(circle at 12% 18%,#6fd2ff33 0 3px,transparent 4px),radial-gradient(circle at 88% 72%,#ffe07344 0 4px,transparent 5px),linear-gradient(145deg,#07152f,#102b63 55%,#164771)}
    .card{width:min(100%,720px);padding:clamp(20px,6vw,52px);border:3px solid #ffffffb3;border-radius:clamp(24px,5vw,38px);background:#f8fbff;box-shadow:0 22px 0 #020a1f47,0 34px 70px #0005;text-align:center}
    .planet{width:88px;height:88px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;color:#fff;background:linear-gradient(145deg,#4268ef,#6c49c9);box-shadow:inset -8px -10px #1f10693d,0 10px 24px #3040aa40;font-size:2.5rem}
    .eyebrow{margin:0 0 8px;color:var(--blue);font-weight:900;letter-spacing:.12em}.title{margin:0;font-size:clamp(2rem,8vw,3.5rem);line-height:1.12;letter-spacing:-.04em}.intro{max-width:520px;margin:20px auto;color:var(--muted);font-size:clamp(1.05rem,3.5vw,1.3rem);line-height:1.7}
    .subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 30px}.subject{min-height:108px;display:grid;place-items:center;align-content:center;gap:7px;border:3px solid transparent;border-radius:22px;font-size:1.1rem;font-weight:900;cursor:pointer;touch-action:manipulation}.subject b{font-size:1.8rem}.subject[data-kind=math]{color:#3157b7;background:#e7edff}.subject[data-kind=chinese]{color:#9a4c13;background:#fff0dc}.subject[data-kind=focus]{color:#17694d;background:#def6e9}.subject.active{border-color:currentColor;transform:translateY(-3px);box-shadow:0 6px currentColor}
    .picker{margin:-8px 0 10px;color:var(--muted);font-weight:900}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 28px}.level{min-height:82px;padding:7px 3px;display:grid;place-items:center;align-content:center;gap:3px;border:2px solid #cbd8fa;border-radius:18px;color:#3157b7;background:#fff;font-weight:900;cursor:pointer}.level small{color:#66728b}.level.active{border-color:#ff6b4a;color:#9d301e;background:#fff0ec;box-shadow:0 5px #f2a08d;transform:translateY(-2px)}.level:disabled{color:#8b93a5;background:#edf0f5;border-color:#dde1e9;box-shadow:none;transform:none;cursor:not-allowed}
    .primary{min-width:min(100%,290px);min-height:62px;padding:12px 24px;border:0;border-radius:20px;color:#fff;background:var(--orange);box-shadow:0 7px #bf3c27;font-size:1.2rem;font-weight:900;cursor:pointer}.primary:active{transform:translateY(4px);box-shadow:0 3px #bf3c27}.settings{margin-top:32px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;color:var(--muted);font-weight:800}.settings label{display:flex;align-items:center;gap:8px}.settings input{width:22px;height:22px;accent-color:var(--blue)}
    .top{display:flex;align-items:center;gap:14px;text-align:left}.chip{padding:9px 12px;border-radius:14px;color:#3157b7;background:#e7edff;font-weight:900}.progressbox{flex:1}.progresslabel{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--muted);font-size:.9rem;font-weight:800}.track{height:14px;overflow:hidden;border-radius:99px;background:#dfe7fb}.bar{height:100%;width:0;background:#4f72e8;transition:width .3s}.iconbtn{width:50px;height:50px;border:0;border-radius:16px;color:#3451a6;background:#e8edff;font-size:1.3rem;cursor:pointer}.reward{min-height:42px;display:flex;align-items:center;gap:10px;margin-top:14px;color:#8b5800;font-weight:900}.streak{padding:7px 11px;border-radius:99px;color:#17694d;background:#dff7e9;font-size:.9rem}
    .question{padding:clamp(24px,6vw,48px) 0 28px}.display{margin:0 auto;max-width:620px;font-size:clamp(1.7rem,6vw,3rem);line-height:1.35;letter-spacing:-.025em}.display.math{font-size:clamp(2.8rem,13vw,6rem);font-variant-numeric:tabular-nums}
    .answers{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,3vw,18px)}.answer{min-height:clamp(72px,17vw,96px);padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid #cbd8fa;border-radius:23px;color:#203466;background:#fff;box-shadow:0 6px #cbd8fa;font-size:clamp(1.25rem,5.5vw,2.2rem);font-weight:900;cursor:pointer;touch-action:manipulation}.answer:active{transform:translateY(4px);box-shadow:0 2px #cbd8fa}.answer:disabled{cursor:not-allowed}.answer.correct{border-color:#44b985;color:#126945;background:#dff8eb;box-shadow:0 6px #44b985}.answer.wrong{border-color:#f59b85;color:#9d301e;background:#fff0ec;animation:nudge .25s 2}.answer.tried{opacity:.42;box-shadow:none;text-decoration:line-through}
    .feedback{min-height:52px;margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#425170;font-size:1.05rem;font-weight:900;text-align:left}.hintbtn{min-height:44px;padding:8px 12px;border:0;border-radius:14px;color:#775800;background:#fff0b8;font-weight:900;cursor:pointer}.hint{margin-top:8px;padding:15px 17px;border-left:5px solid #f4bd3d;border-radius:12px;color:#624d18;background:#fff8dc;line-height:1.6;text-align:left}.score{margin:24px}.score strong{display:block;color:var(--blue);font-size:5rem;line-height:1}.secondary{min-height:56px;margin:16px 8px 0;padding:10px 20px;border:2px solid #cbd8fa;border-radius:18px;color:#3157b7;background:#fff;font-weight:900;cursor:pointer}.hidden{display:none!important}@keyframes nudge{50%{transform:translateX(5px)}}
    .no-motion *{animation-duration:.01ms!important;transition-duration:.01ms!important}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    @media(max-width:520px){.shell{padding:10px;place-items:stretch}.card{align-self:center;padding:24px 16px;border-radius:26px}.subjects{gap:8px}.subject{min-height:94px;font-size:1rem}.top{gap:8px}.chip{padding:8px;font-size:.9rem}.feedback{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell" id="app">
    <section class="card" id="menu">
      <div class="planet" aria-hidden="true">🚀</div><p class="eyebrow">今天的小任務</p><h1 class="title">學習星球大冒險</h1><p class="intro">第一次答對才有星星，拿到 5 顆星就能升級！</p>
      <div class="subjects" aria-label="選擇任務"><button class="subject active" data-kind="math"><b>＋</b>數學</button><button class="subject" data-kind="chinese"><b>文</b>國語</button><button class="subject" data-kind="focus"><b>◎</b>專注力</button></div>
      <p class="picker">選擇關卡</p><div class="levels" id="levels"></div>
      <button class="primary" id="start">🚀 開始數學第 1 關</button>
      <div class="settings"><label><input type="checkbox" id="sound"> 音效</label><label><input type="checkbox" id="motion" checked> 輕柔動畫</label></div>
    </section>
    <section class="card hidden" id="game" aria-live="polite">
      <header class="top"><span class="chip" id="chip">數學</span><div class="progressbox"><div class="progresslabel"><span id="round">第 1 題</span><span>8 題</span></div><div class="track"><div class="bar" id="bar"></div></div></div><button class="iconbtn" id="soundBtn" aria-label="切換音效">🔇</button></header>
      <div class="reward"><span id="stars">⭐ 0</span><span class="streak hidden" id="streak"></span></div>
      <div class="question"><p class="eyebrow" id="prompt"></p><h1 class="display" id="display"></h1></div><div class="answers" id="answers"></div>
      <div class="feedback"><span id="message">選一個答案</span><button class="hintbtn" id="hintBtn">💡 給我提示</button></div><aside class="hint hidden" id="hint"></aside>
    </section>
    <section class="card hidden" id="finish"><div class="planet" aria-hidden="true">🏆</div><p class="eyebrow" id="finishMode"></p><h1 class="title" id="finishTitle">太棒了，升級成功！</h1><div class="score"><strong id="finishScore">0</strong><span>顆星星／需要 5 顆</span></div><p class="intro" id="finishText"></p><button class="primary" id="next">🚀 挑戰下一關</button><button class="secondary" id="again">↻ 再玩一次</button><button class="secondary" id="home">選其他任務</button></section>
  </main>
  <script>
    const TOTAL=8;
    const labels={math:'數學',chinese:'國語',focus:'專注力'};
    const chinese=[
      ['選出正確的詞語','今天的天氣很＿＿，適合去公園。',['晴朗','清朗','晴郎','清郎'],'晴朗','「晴」和太陽、天氣有關。'],
      ['哪個詞語最適合？','妹妹＿＿地把積木收進盒子。',['仔細','清楚','熱鬧','飛快'],'仔細','想想收拾東西時，需要小心還是熱鬧？'],
      ['找出意思相近的詞','「開心」和哪個詞最接近？',['快樂','難過','安靜','生氣'],'快樂','想想笑咪咪時的心情。'],
      ['選出正確的量詞','一＿＿鉛筆',['枝','座','片','朵'],'枝','細長的筆，通常用哪個量詞？'],
      ['哪個句子最通順？','選出語序正確的句子。',['小鳥在樹上唱歌。','在唱歌小鳥樹上。','樹上小鳥歌唱在。','唱歌在小鳥樹上。'],'小鳥在樹上唱歌。','先找「誰」，再找「在哪裡做什麼」。'],
      ['選出相反的詞','「勇敢」的相反詞是？',['膽小','堅強','認真','活潑'],'膽小','遇到困難時，很害怕可以怎麼形容？'],
      ['選出正確的字','我＿＿經寫完功課了。',['已','以','己','乙'],'已','「已經」表示事情完成了。'],
      ['讀一讀，找答案','小安帶著雨傘出門，因為天空烏雲密布。接下來最可能發生什麼？',['下雨','下雪','刮颱風','出太陽'],'下雨','烏雲和雨傘提供了線索。']
    ];
    const chineseAdvanced=[
      ['選出正確的成語','大家你一句、我一句，教室裡＿＿。',['七嘴八舌','一心一意','自言自語','鴉雀無聲'],'七嘴八舌','很多人同時說話，會是什麼樣子？'],
      ['找出連接詞','＿＿外面下雨，＿＿我們改在室內活動。',['因為／所以','雖然／但是','不但／而且','先／再'],'因為／所以','前面是原因，後面是結果。'],
      ['找出錯別字','哪一個詞語寫錯了？',['功課','休息','己經','圖書館'],'己經','表示事情完成，要用「已」。'],
      ['閱讀推論','地上有濕腳印，窗邊的花盆倒了。最可能發生什麼事？',['小狗從雨中跑進來','有人正在睡覺','太陽非常大','大家在看書'],'小狗從雨中跑進來','把兩個線索放在一起想。'],
      ['找出成語的意思','「半途而廢」的意思是？',['事情做到一半就停止','很快把事情完成','一邊走一邊休息','先失敗後成功'],'事情做到一半就停止','「半途」是半路，「廢」是停止。'],
      ['選出病句','哪一句需要修改？',['我看見美麗的花香。','妹妹穿上紅色外套。','大家開心地唱歌。','爸爸仔細閱讀報紙。'],'我看見美麗的花香。','花香能用眼睛「看見」嗎？'],
      ['找出正確關係','「蜜蜂：蜂蜜」就像「乳牛：＿＿」。',['牛奶','草地','牧場','尾巴'],'牛奶','想想前一個動物能提供什麼。'],
      ['閱讀主旨','小樹經過風吹雨打，仍努力向上生長。這句話告訴我們？',['遇到困難也不要放棄','下雨時不要出門','小樹長得非常快','風雨會傷害植物'],'遇到困難也不要放棄','注意「仍努力」帶出的精神。'],
      ['改寫句子','「弟弟打破了花瓶。」改成把字句是？',['弟弟把花瓶打破了。','花瓶把弟弟打破了。','打破弟弟的是花瓶。','花瓶弟弟把打破了。'],'弟弟把花瓶打破了。','誰＋把＋東西＋怎麼了。'],
      ['選出適合的成語','他每天練習跑步，從不偷懶，真是＿＿。',['持之以恆','手忙腳亂','大吃一驚','東張西望'],'持之以恆','長時間一直努力、不放棄。']
    ];
    const focus=[
      ['找出完全一樣的符號','目標：★●▲',['★●▲','★▲●','☆●▲','★●△'],'★●▲','從左到右，一個一個比對。'],
      ['找出完全一樣的符號','目標：◆○■',['◇○■','◆○■','◆●■','◆○□'],'◆○■','注意實心和空心。'],
      ['找出不同的一個','其他三個都相同。',['貝貝貝','貝貝見','貝貝貝','貝貝貝'],'貝貝見','仔細看最後一個字。'],
      ['找出完全一樣的數字','目標：6389',['6389','6398','6839','6386'],'6389','用手指遮住後面，一位一位看。'],
      ['找出不同的一個','其他三個方向相同。',['↑→↓','↑→↓','↑←↓','↑→↓'],'↑←↓','注意中間箭頭的方向。'],
      ['找出完全一樣的圖案','目標：☀☁☂',['☀☁☂','☀☂☁','☁☀☂','☀☁☃'],'☀☁☂','先看太陽，再看雲，最後看雨傘。'],
      ['找出不同的一個','其他三個字母相同。',['bdpq','bdpq','bqpq','bdpq'],'bqpq','注意第二個字母。'],
      ['找出完全一樣的色彩順序','目標：紅－藍－黃',['紅－黃－藍','藍－紅－黃','紅－藍－黃','黃－藍－紅'],'紅－藍－黃','在心裡念一次：紅、藍、黃。']
    ];
    let subject='math',level=1,round=0,stars=0,streak=0,current=null,locked=false,cooldown=false,attempted=new Set;
    let unlocks={math:1,chinese:1,focus:1};try{unlocks={...unlocks,...JSON.parse(localStorage.getItem('learning-planet-levels')||'{}')}}catch(e){}
    const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);
    function math(){let k=Math.floor(Math.random()*3),a,b,ans,sign;if(level===3&&k===0){let packs=3+Math.floor(Math.random()*6),each=4+Math.floor(Math.random()*6),extra=2+Math.floor(Math.random()*11);ans=packs*each+extra;let wrong=new Set;while(wrong.size<3){let v=ans+Math.floor(Math.random()*17)-8;if(v>=0&&v!==ans)wrong.add(v)}return['兩步驟挑戰',`${packs} 包糖果，每包 ${each} 顆，再加 ${extra} 顆，共有幾顆？`,shuffle([ans,...wrong]).map(String),String(ans),'先算每包糖果的總數，再加上多出來的糖果。']}if(level===3&&k===1){let d=3+Math.floor(Math.random()*6),q=5+Math.floor(Math.random()*8),r=1+Math.floor(Math.random()*(d-1)),total=d*q+r;return['找出餘數',`${total} 顆球，每 ${d} 顆裝一盒，最後剩幾顆？`,shuffle([r,0,d,r+1]).map(String),String(r),'先找最接近、但不超過總數的倍數。']}let upper=level===1?99:900;if(k===0){a=level===1?12+Math.floor(Math.random()*69):120+Math.floor(Math.random()*480);b=4+Math.floor(Math.random()*Math.max(5,upper-a));ans=a+b;sign='+'}else if(k===1){a=level===1?25+Math.floor(Math.random()*70):220+Math.floor(Math.random()*680);b=3+Math.floor(Math.random()*(a-3));ans=a-b;sign='−'}else{a=level===1?2+Math.floor(Math.random()*4):3+Math.floor(Math.random()*7);b=2+Math.floor(Math.random()*8);ans=a*b;sign='×'}let wrong=new Set;while(wrong.size<3){let o=Math.floor(Math.random()*15)-7,c=Math.max(0,ans+(o===0?8:o));if(c!==ans)wrong.add(c)}let hint=sign==='×'?`可以把 ${a} 加自己 ${b} 次。`:sign==='+'?'先算到下一個整十，再把剩下的加上去。':`試著從 ${a} 往回數 ${b}。`;return['算算看',`${a} ${sign} ${b} = ?`,shuffle([ans,...wrong]).map(String),String(ans),hint]}
    function focusGame(){let pools=level===1?['★●▲◆○■△◇□','6389251740','↑↓←→']:level===2?['6389251740','晴睛清情請靜','↑↓←→★●']:['6389251740','晴睛清情請靜精','bdpq6890'],pool=shuffle(pools)[0],target='';for(let i=0;i<level+2;i++)target+=pool[Math.floor(Math.random()*pool.length)];const mutate=text=>{let chars=[...text],i=Math.floor(Math.random()*chars.length),v=chars[i];while(v===chars[i])v=pool[Math.floor(Math.random()*pool.length)];chars[i]=v;return chars.join('')};if(level===3&&Math.random()>.5){let ans=[...target].reverse().join(''),wrong=new Set;while(wrong.size<3){let v=mutate(ans);if(v!==ans)wrong.add(v)}return['工作記憶挑戰',`把「${target}」倒過來，哪一個正確？`,shuffle([ans,...wrong]),ans,'從最後一個開始，一個一個往前讀。']}let wrong=new Set;while(wrong.size<3){let v=mutate(target);if(v!==target)wrong.add(v)}return['找出完全一樣的內容',`目標：${target}`,shuffle([target,...wrong]),target,level===1?'從左到右，一個一個比對。':'先看開頭和結尾，再檢查中間。']}
    function challenge(){let data;if(subject==='math')data=math();else if(subject==='focus')data=level===1&&Math.random()<.35?focus[round%focus.length]:focusGame();else{let bank=level===1?chinese:level===2?[...chinese,...chineseAdvanced]:chineseAdvanced;data=bank[Math.floor(Math.random()*bank.length)]}return{prompt:data[0],display:data[1],choices:shuffle(data[2]),answer:data[3],hint:data[4]}}
    function tone(ok){if(!$('sound').checked)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?660:220;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.16)}
    function show(id){['menu','game','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
    function renderLevels(){let box=$('levels');box.innerHTML='';[1,2,3].forEach(n=>{let b=document.createElement('button'),locked=n>unlocks[subject];b.className='level'+(n===level?' active':'');b.disabled=locked;b.innerHTML=`<span>${locked?'🔒':['🌱','🚀','🏆'][n-1]}</span><strong>第 ${n} 關</strong><small>${locked?'尚未解鎖':['暖身關','成長關','挑戰關'][n-1]}</small>`;b.onclick=()=>{level=n;renderLevels();updateStart()};box.appendChild(b)})}
    function updateStart(){$('start').textContent=`🚀 開始${labels[subject]}第 ${level} 關`}
    function render(){current=challenge();locked=false;cooldown=false;attempted=new Set;$('chip').textContent=`${labels[subject]} · 第 ${level} 關`;$('round').textContent=`第 ${round+1} 題`;$('bar').style.width=`${round/TOTAL*100}%`;$('stars').textContent=`⭐ ${stars}／5`;$('prompt').textContent=current.prompt;$('display').textContent=current.display;$('display').classList.toggle('math',subject==='math'&&current.display.length<18);$('message').textContent='選一個答案';$('hint').textContent=current.hint;$('hint').classList.add('hidden');$('hintBtn').classList.remove('hidden');$('streak').classList.toggle('hidden',streak<2);$('streak').textContent=`連續答對 ${streak} 題`;$('answers').innerHTML='';current.choices.forEach((choice,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=choice;b.onclick=()=>answer(choice,b);b.setAttribute('aria-label',`答案 ${choice}`);$('answers').appendChild(b)})}
    function begin(){round=0;stars=0;streak=0;show('game');render()}
    function answer(choice,button){if(locked||cooldown||attempted.has(choice))return;if(choice!==current.answer){attempted.add(choice);button.classList.add('wrong','tried');button.disabled=true;$('message').textContent='先停一下，想好再選；這題就不計星星囉';streak=0;cooldown=true;tone(false);document.querySelectorAll('.answer').forEach(x=>x.disabled=true);setTimeout(()=>{cooldown=false;document.querySelectorAll('.answer').forEach(x=>x.disabled=attempted.has(x.textContent))},900);return}locked=true;button.classList.add('correct');button.textContent+=' ✓';let earned=attempted.size===0;if(earned)stars++;streak++;$('stars').textContent=`⭐ ${stars}／5`;$('message').textContent=earned?'第一次就答對！獲得一顆星星':'答對了！這題練習完成';tone(true);setTimeout(()=>{round++;if(round>=TOTAL){let passed=stars>=5;if(passed&&level<3){unlocks[subject]=Math.max(unlocks[subject],level+1);localStorage.setItem('learning-planet-levels',JSON.stringify(unlocks))}$('finishScore').textContent=stars;$('finishMode').textContent=`${labels[subject]}第 ${level} 關完成`;$('finishTitle').textContent=passed?(level<3?'太棒了，升級成功！':'你成為學習小高手了！'):'差一點，再練一次！';$('finishText').textContent=passed?(level<3?`第 ${level+1} 關已解鎖，準備迎接更有挑戰的題目！`:'最高難度完成！重玩還會遇到不同題目。'):'先看清楚、想好再選。下一次一定能拿到更多星星！';$('next').classList.toggle('hidden',!passed||level>=3);show('finish')}else render()},$('motion').checked?750:250)}
    document.querySelectorAll('.subject').forEach(b=>b.onclick=()=>{document.querySelectorAll('.subject').forEach(x=>x.classList.remove('active'));b.classList.add('active');subject=b.dataset.kind;level=unlocks[subject];renderLevels();updateStart()});
    $('start').onclick=begin;$('next').onclick=()=>{level++;begin()};$('again').onclick=begin;$('home').onclick=()=>{renderLevels();updateStart();show('menu')};$('hintBtn').onclick=()=>{$('hint').classList.toggle('hidden')};$('soundBtn').onclick=()=>{$('sound').checked=!$('sound').checked;$('soundBtn').textContent=$('sound').checked?'🔊':'🔇'};$('sound').onchange=()=>{$('soundBtn').textContent=$('sound').checked?'🔊':'🔇'};$('motion').onchange=()=>document.body.classList.toggle('no-motion',!$('motion').checked);renderLevels();updateStart();
    // Focus adventure: short stages within a longer, saved journey.
    const focusStages = ['符號偵探','找不同','規律接龍','記憶背包','指令導航','目標搜尋','偵探進階','細節高手','規律高手','記憶高手','反向導航','綜合挑戰'];
    const stageCount = () => subject === 'focus' ? focusStages.length : 3;
    const mix = values => { const a=[...values]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
    const rand = n => Math.floor(Math.random()*n);
    let adventureActive=false, previewing=false, paused=false, feedbackTimer=null, cooldownTimer=null, pendingAdvance=false;
    function saveProgress(){try{localStorage.setItem('learning-planet-levels',JSON.stringify(unlocks))}catch(e){$('finishText').textContent+=' 此瀏覽器無法儲存進度，請保持頁面開啟。'}}
    for(const key of Object.keys(labels)){const max=key==='focus'?12:3;unlocks[key]=Number.isInteger(unlocks[key])?Math.max(1,Math.min(max,unlocks[key])):1}
    function focusChallenge(){
      const type=level===12?round%6:((level-1)%6+round%2)%6;
      const hard=level>6, symbols=['★','●','▲','◆','○','■','△','□'], length=hard?5:3;
      const sequence=()=>Array.from({length},()=>symbols[rand(symbols.length)]).join('');
      const mutate=text=>{const chars=[...text],i=rand(chars.length);chars[i]=mix(symbols.filter(s=>s!==chars[i]))[0];return chars.join('')};
      const result=(prompt,display,answer,choices,hint,extra={})=>({prompt,display,answer:String(answer),choices:mix(choices.map(String)),hint,...extra});
      const alternatives=text=>{const wrong=new Set;while(wrong.size<3)wrong.add(mutate(text));return [text,...wrong]};
      if(type===0){const target=sequence();return result('符號偵探','目標：'+target,target,alternatives(target),'從左到右，注意空心與實心。')}
      if(type===1){const same=sequence(),odd=mutate(same);return result('找不同','選出與其他三個不同的一列。',odd,[same,same,same,odd],'逐個位置比對，只有一列不一樣。')}
      if(type===2){const unit=mix(symbols).slice(0,hard?3:2),count=hard?8:5,answer=unit[count%unit.length];return result('規律接龍',Array.from({length:count},(_,i)=>unit[i%unit.length]).join('　')+'　？',answer,[answer,...mix(symbols.filter(s=>s!==answer)).slice(0,3)],'找出反覆出現的一組，再接下去。')}
      if(type===3){const target=sequence();return result('記憶背包',target,target,alternatives(target),'把圖案分成小組，在心裡念一次。',{memory:true})}
      if(type===4){const arrows=['↑','→','↓','←'],i=rand(4),reverse=hard&&round%2===1,answer=arrows[(i+(reverse?2:0))%4];return result('指令導航',(reverse?'選「相反」方向：':'選「相同」方向：')+arrows[i],answer,arrows,'先讀相同或相反，再看箭頭方向。')}
      const target=symbols[rand(symbols.length)],count=hard?16:9,amount=2+rand(hard?6:4),other=symbols.filter(s=>s!==target),items=mix([...Array(amount).fill(target),...Array.from({length:count-amount},()=>other[rand(other.length)])]);
      return result('目標搜尋','數一數「'+target+'」有幾個？\n'+items.map((s,i)=>s+((i+1)%(hard?4:3)===0?'\n':'　')).join(''),amount,[amount,amount-1,amount+1,amount+2],'一行一行數，數過的位置用手指記住。');
    }
    const originalChallenge=challenge;
    challenge=function(){return subject==='focus'?focusChallenge():originalChallenge()};
    const memoryButton=document.createElement('button');memoryButton.id='remember';memoryButton.className='secondary hidden';memoryButton.textContent='我記好了，開始作答';$('display').after(memoryButton);
    const continueButton=document.createElement('button');continueButton.id='continue';continueButton.className='secondary hidden';continueButton.textContent='下一題 →';$('hint').after(continueButton);
    const pauseButton=document.createElement('button');pauseButton.id='pause';pauseButton.className='secondary';pauseButton.textContent='休息一下';$('game').appendChild(pauseButton);
    const pauseCard=document.createElement('section');pauseCard.id='pauseCard';pauseCard.className='card hidden';pauseCard.innerHTML='<h1 class="title">休息一下</h1><p class="intro">放鬆肩膀、看看遠方。準備好再繼續，沒有倒數。</p><button id="resume" class="primary">繼續這一關</button>';$('app').appendChild(pauseCard);
    const adventureNote=document.createElement('p');adventureNote.className='intro';adventureNote.id='adventureNote';$('levels').before(adventureNote);
    show=function(id){['menu','game','finish','pauseCard'].forEach(x=>$(x).classList.toggle('hidden',x!==id))};
    renderLevels=function(){
      $('levels').innerHTML='';$('adventureNote').textContent=subject==='focus'?'專注力冒險 · 12 關 × 每關 8 題。每關 5 顆星解鎖下一站；進度儲存在這個瀏覽器，可分幾天完成。':'';
      for(let n=1;n<=stageCount();n++){const b=document.createElement('button'),isLocked=n>unlocks[subject];b.className='level'+(n===level?' active':'');b.disabled=isLocked;b.setAttribute('aria-pressed',String(n===level));b.innerHTML='<strong>第 '+n+' 關</strong><small>'+(isLocked?'🔒 ':n<unlocks[subject]?'✓ ':'')+(subject==='focus'?focusStages[n-1]:['暖身關','成長關','挑戰關'][n-1])+'</small>';b.onclick=()=>{level=n;renderLevels();updateStart()};$('levels').appendChild(b)}
    };
    function buttonsState(){document.querySelectorAll('.answer').forEach(b=>b.disabled=locked||cooldown||previewing||paused||attempted.has(b.dataset.choice))}
    render=function(){
      current=challenge();locked=false;cooldown=false;attempted=new Set;previewing=!!current.memory;pendingAdvance=false;continueButton.classList.add('hidden');
      $('chip').textContent=labels[subject]+' · '+level+'/'+stageCount();$('round').textContent='第 '+(round+1)+' 題';$('bar').style.width=round/TOTAL*100+'%';$('stars').textContent='⭐ '+stars+'／5';$('prompt').textContent=current.prompt;
      $('display').textContent=current.display;$('display').classList.toggle('math',subject==='math'&&current.display.length<18);$('display').style.whiteSpace='pre-line';
      $('message').textContent=previewing?'慢慢記，準備好再按下方按鈕。':'先想好，再選一個答案。';$('hint').textContent=current.hint;$('hint').classList.add('hidden');$('hintBtn').classList.toggle('hidden',previewing);memoryButton.classList.toggle('hidden',!previewing);
      $('streak').classList.toggle('hidden',streak<2);$('streak').textContent='連續答對 '+streak+' 題';$('answers').innerHTML='';$('answers').classList.toggle('hidden',previewing);
      for(const choice of current.choices){const b=document.createElement('button');b.className='answer';b.textContent=choice;b.dataset.choice=choice;b.onclick=()=>answer(choice,b);$('answers').appendChild(b)}
    };
    memoryButton.onclick=()=>{previewing=false;$('display').textContent='剛才背包裡的圖案順序是？';memoryButton.classList.add('hidden');$('answers').classList.remove('hidden');$('hintBtn').classList.remove('hidden');$('message').textContent='回想剛才的順序，再選答案。';buttonsState()};
    begin=function(){clearTimeout(feedbackTimer);clearTimeout(cooldownTimer);round=0;stars=0;streak=0;paused=false;adventureActive=true;show('game');render()};
    function completeStage(){
      adventureActive=false;const passed=stars>=5,max=stageCount();
      $('finishScore').textContent=stars;$('finishMode').textContent=labels[subject]+'第 '+level+' 關完成';$('finishTitle').textContent=passed?(level<max?'太棒了，下一站解鎖！':'冒險完成！'):'這次練習完成了';
      $('finishText').textContent=passed?(level<max?'先休息一下，再出發到第 '+(level+1)+' 關。':'所有關卡都走過了！也可以回頭挑喜歡的關卡，題目會重新產生。'):'這次得到 '+stars+' 顆星。拿到 5 顆可以前進；休息後再試也沒關係。';
      if(passed&&level<max){unlocks[subject]=Math.max(unlocks[subject],level+1);saveProgress()}
      $('next').classList.toggle('hidden',!passed||level>=max);$('next').textContent='前往第 '+(level+1)+' 關';show('finish');
    }
    function advance(){if(!pendingAdvance||paused||!adventureActive)return;pendingAdvance=false;round++;if(round>=TOTAL)completeStage();else render()}
    continueButton.onclick=advance;
    answer=function(choice,button){
      if(!adventureActive||locked||cooldown||previewing||paused||attempted.has(choice))return;
      if(choice!==current.answer){attempted.add(choice);button.classList.add('wrong','tried');streak=0;cooldown=true;$('streak').classList.add('hidden');$('message').textContent='慢慢想，可以看看提示；這題改成練習，不計星星。';tone(false);buttonsState();cooldownTimer=setTimeout(()=>{cooldown=false;buttonsState()},900);return}
      locked=true;const earned=attempted.size===0;if(earned){stars++;streak++}else streak=0;button.classList.add('correct');button.textContent+=' ✓';$('stars').textContent='⭐ '+stars+'／5';$('message').textContent=earned?'第一次就答對！獲得一顆星星。':'練習完成！你找到了答案。';tone(true);buttonsState();pendingAdvance=true;
      if(subject==='focus'){continueButton.textContent=round===TOTAL-1?'看看這關成果':'下一題 →';continueButton.classList.remove('hidden')}else feedbackTimer=setTimeout(advance,$('motion').checked?750:250);
    };
    pauseButton.onclick=()=>{if(!adventureActive)return;paused=true;clearTimeout(feedbackTimer);show('pauseCard')};
    $('resume').onclick=()=>{paused=false;show('game');buttonsState();if(pendingAdvance){continueButton.classList.remove('hidden')}};
    $('start').onclick=begin;$('again').onclick=begin;$('next').onclick=()=>{if(level<stageCount()&&level<unlocks[subject]){level++;begin()}};
    $('home').onclick=()=>{adventureActive=false;renderLevels();updateStart();show('menu')};
    renderLevels();
  </script>
</body>
</html>
