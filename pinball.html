<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07121f"><title>星際救援彈珠台｜學習星球</title><meta name="description" content="用左右擋板接住彈珠，點亮能源塔、依序擊中數字，完成太空站救援。支援手機與鍵盤，另有不限球數的練習模式。"><link rel="canonical" href="https://small3.vercel.app/pinball"><link rel="stylesheet" href="/assets/pinball.css?v=deck-4"><script defer src="/assets/pinball-table.js?v=deck-4"></script><script defer src="/assets/pinball-design.js"></script><script defer src="/assets/pinball-engine.js?v=deck-4"></script><script defer src="/assets/memory-audio.js"></script><script defer src="/assets/pinball-ui.js?v=deck-4"></script></head>
<body><main id="app" data-view="home"><header class="topbar"><a href="/" class="brand">✦ <span>學習星球</span></a><div class="tools"><button id="sound" aria-pressed="true">♫ 聲音開</button><button id="help">? 玩法</button><button id="pause" hidden>Ⅱ 暫停</button></div></header>
<div class="layout"><section id="home" class="home"><p class="eyebrow">ORBIT RESCUE / PINBALL</p><h1>星際救援<span>彈珠台</span></h1><p class="intro">衝上彎曲坡道，點亮能源塔，<br>完成你的太空救援。</p><fieldset><legend>選擇遊玩模式</legend><div class="modes"><button id="missionMode" aria-pressed="true"><strong>任務模式</strong><span>三顆球・完成三項救援</span></button><button id="practiceMode" aria-pressed="false"><strong>練習模式</strong><span>不限球數・慢慢練習</span></button></div></fieldset><p class="quick-tip">左右按鍵接球，按住「發射」蓄力。<br>發球後有 8 秒救球保護。<br>打進左側坡道上到紫色高架平台，撞球得分後從底部洞口回到主球台。</p><button id="start" class="primary" disabled>正在準備球台…</button><p id="loadStatus" role="status">正在載入元件圖片</p><a href="/pinball-editor.html" class="home-link">球台設計室：拖拉元件</a><a href="/" class="home-link">返回學習首頁</a></section>
<section class="play-area" aria-label="彈珠球台"><div class="hud"><div><span>得分</span><strong id="score">0</strong></div><div><span>剩餘球</span><strong id="lives">3</strong></div><div><span>救援進度</span><strong id="stage">0 / 3</strong></div></div><div class="task"><span id="taskText">點亮三座能源塔</span><strong id="taskCount">0 / 3</strong><div class="track"><i id="progress"></i></div></div><div id="board" class="board"><canvas id="table" width="480" height="860" role="img" aria-label="星際救援彈珠台，使用下方按鈕或鍵盤左右方向鍵操作"></canvas></div><div id="notice" class="notice" role="status">按住發射，鬆開送出彈珠</div><div class="controls"><button id="left" aria-label="左擋板，按住抬起" aria-pressed="false">◀ <span>左擋板</span></button><button id="right" aria-label="右擋板，按住抬起" aria-pressed="false"><span>右擋板</span> ▶</button><button id="launch" aria-label="按住蓄力，鬆開發射"><span id="launchText">發射</span><span class="charge-track"><i id="chargeFill"></i></span></button></div><p class="keyboard-hint">← → 控制擋板 · 空白鍵蓄力發射 · P 暫停</p></section></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><p class="eyebrow" id="dialogTag">MISSION PAUSED</p><h2 id="dialogTitle">任務已暫停</h2><p id="dialogCopy"></p><div id="result" hidden><span>本次得分</span><strong id="resultScore">0</strong></div><div class="dialog-actions"><button id="resume" class="primary">繼續任務</button><button id="restart">再玩一次</button><button id="menu">返回主選單</button><button id="closeHelp" hidden>了解，準備出發</button></div></dialog><noscript>請開啟 JavaScript 才能遊玩彈珠台。</noscript></main></body></html>
